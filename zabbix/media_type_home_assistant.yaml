# Home Assistant webhook media type for Zabbix 7.0+ (manual setup).
# Import under Alerts -> Media types -> Import, then set the Secret
# parameter to the secret shown in the Zabbix integration (Configure ->
# Alerts). Generated by scripts/generate_media_type.py; don't edit by hand.
zabbix_export:
  version: '7.0'
  media_types:
    - name: 'Home Assistant'
      type: WEBHOOK
      parameters:
        - sortorder: '0'
          name: URL
          value: '{ALERT.SENDTO}'
        - sortorder: '1'
          name: Secret
          value: '<secret>'
        - sortorder: '2'
          name: HTTPProxy
          value: ''
        - sortorder: '3'
          name: event_id
          value: '{EVENT.ID}'
        - sortorder: '4'
          name: event_value
          value: '{EVENT.VALUE}'
        - sortorder: '5'
          name: event_update_status
          value: '{EVENT.UPDATE.STATUS}'
        - sortorder: '6'
          name: trigger_id
          value: '{TRIGGER.ID}'
        - sortorder: '7'
          name: event_nseverity
          value: '{EVENT.NSEVERITY}'
      script: |
        // ha-zabbix-alerts media type, script version 1.
        var params = JSON.parse(value);
        if (!params.URL || !params.Secret) {
            throw 'The URL (user media "Send to") and Secret parameters are required.';
        }
        var request = new HttpRequest();
        request.addHeader('Content-Type: application/json');
        request.addHeader('X-Zabbix-Alert-Secret: ' + params.Secret);
        if (params.HTTPProxy) {
            request.setProxy(params.HTTPProxy);
        }
        var response = request.post(params.URL, JSON.stringify({
            event_id: params.event_id,
            event_value: params.event_value,
            event_update_status: params.event_update_status,
            trigger_id: params.trigger_id,
            event_nseverity: params.event_nseverity
        }));
        if (request.getStatus() !== 200) {
            throw 'Home Assistant answered HTTP ' + request.getStatus() + ': ' + response;
        }
        return 'OK';
      timeout: 30s
      description: 'Sends Zabbix problem alerts to Home Assistant (ha-zabbix).'
      message_templates:
        - event_source: TRIGGERS
          operation_mode: PROBLEM
          subject: 'Problem: {EVENT.NAME}'
          message: '{EVENT.NAME} on {HOST.NAME}'
        - event_source: TRIGGERS
          operation_mode: RECOVERY
          subject: 'Resolved: {EVENT.NAME}'
          message: '{EVENT.NAME} on {HOST.NAME}'
        - event_source: TRIGGERS
          operation_mode: UPDATE
          subject: 'Updated: {EVENT.NAME}'
          message: '{EVENT.NAME} on {HOST.NAME}'
